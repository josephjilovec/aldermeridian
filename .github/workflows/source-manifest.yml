name: Inspect storefront source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/source-manifest.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record editable storefront source paths
        shell: bash
        run: |
          find . -type f \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -not -path './.next/*' \
            -not -path './dist/*' \
            -not -path './.github/workflows/source-manifest.yml' \
            | sort | sed 's#^./##' > SOURCE_MANIFEST.txt
      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE_MANIFEST.txt
          git commit -m "Record storefront source manifest" || true
          git push
